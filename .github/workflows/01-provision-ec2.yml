# Pipeline 1: Prepara el entorno de una instancia EC2 (Ubuntu 22.04/24.04)
# para una app Flask + MySQL + Gunicorn + Nginx.
# Se ejecuta manualmente (es idempotente: se puede relanzar sin romper nada).
#
# Secrets requeridos (Settings > Secrets and variables > Actions, en el environment):
#   EC2_HOST, EC2_USER, EC2_SSH_KEY
#   MYSQL_ROOT_PASSWORD, DB_NAME, DB_USER, DB_PASSWORD, FLASK_SECRET_KEY

name: 01 - Provision EC2

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Entorno destino"
        type: choice
        options: [staging, production]
        default: staging
      python_version:
        description: "Versión de Python"
        default: "3.12"

jobs:
  provision:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      APP_DIR: /opt/flaskapp
      APP_USER: flaskapp
    steps:
      - name: Instalar paquetes del sistema
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            sudo apt-get update -y
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
              python3 python3-venv python3-pip python3-dev \
              build-essential pkg-config default-libmysqlclient-dev \
              mysql-server nginx git rsync ufw
            sudo systemctl enable --now mysql nginx

      - name: Configurar MySQL (root, base de datos y usuario)
        uses: appleboy/ssh-action@v1.2.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: MYSQL_ROOT_PASSWORD,DB_NAME,DB_USER,DB_PASSWORD
          script: |
            set -euo pipefail
            # Archivo de credenciales temporal (evita contraseñas en la línea de comandos)
            CNF=$(mktemp); chmod 600 "$CNF"
            trap 'rm -f "$CNF"' EXIT

            # Primera vez: root usa auth_socket -> fijar contraseña
            if sudo mysql -e "SELECT 1" >/dev/null 2>&1; then
              sudo mysql -e "ALTER USER 'root'@'localhost' IDENTIFIED WITH caching_sha2_password BY '${MYSQL_ROOT_PASSWORD}';"
            fi
            printf "[client]\nuser=root\npassword=%s\n" "$MYSQL_ROOT_PASSWORD" > "$CNF"

            # Endurecimiento básico (equivalente a mysql_secure_installation)
            mysql --defaults-extra-file="$CNF" <<SQL
            DELETE FROM mysql.user WHERE User='';
            DELETE FROM mysql.user WHERE User='root' AND Host NOT IN ('localhost','127.0.0.1','::1');
            DROP DATABASE IF EXISTS test;
            CREATE DATABASE IF NOT EXISTS \`${DB_NAME}\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
            CREATE USER IF NOT EXISTS '${DB_USER}'@'localhost' IDENTIFIED BY '${DB_PASSWORD}';
            ALTER USER '${DB_USER}'@'localhost' IDENTIFIED BY '${DB_PASSWORD}';
            GRANT ALL PRIVILEGES ON \`${DB_NAME}\`.* TO '${DB_USER}'@'localhost';
            FLUSH PRIVILEGES;
            SQL

            # MySQL solo escucha en localhost
            sudo sed -i 's/^bind-address.*/bind-address = 127.0.0.1/' /etc/mysql/mysql.conf.d/mysqld.cnf
            sudo systemctl restart mysql

      - name: Usuario, directorios, virtualenv y .env
        uses: appleboy/ssh-action@v1.2.0
        env:
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          FLASK_SECRET_KEY: ${{ secrets.FLASK_SECRET_KEY }}
          APP_DIR: ${{ env.APP_DIR }}
          APP_USER: ${{ env.APP_USER }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DB_NAME,DB_USER,DB_PASSWORD,FLASK_SECRET_KEY,APP_DIR,APP_USER
          script: |
            set -euo pipefail
            id "$APP_USER" >/dev/null 2>&1 || sudo useradd --system --create-home --shell /bin/bash "$APP_USER"
            sudo mkdir -p "$APP_DIR"/{app,backups,logs}
            sudo chown -R "$APP_USER":"$APP_USER" "$APP_DIR"
            sudo usermod -aG "$APP_USER" "$USER"   # el usuario SSH puede hacer rsync
            sudo chmod -R g+w "$APP_DIR"

            [ -d "$APP_DIR/venv" ] || sudo -u "$APP_USER" python3 -m venv "$APP_DIR/venv"
            sudo -u "$APP_USER" "$APP_DIR/venv/bin/pip" install --upgrade pip wheel gunicorn

            sudo tee "$APP_DIR/.env" >/dev/null <<EOF
            FLASK_APP=wsgi.py
            FLASK_ENV=production
            SECRET_KEY=${FLASK_SECRET_KEY}
            DATABASE_URL=mysql+pymysql://${DB_USER}:${DB_PASSWORD}@127.0.0.1:3306/${DB_NAME}
            EOF
            sudo sed -i 's/^ *//' "$APP_DIR/.env"
            sudo chown "$APP_USER":"$APP_USER" "$APP_DIR/.env"
            sudo chmod 600 "$APP_DIR/.env"

      - name: Servicio systemd (Gunicorn) y Nginx
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_DIR: ${{ env.APP_DIR }}
          APP_USER: ${{ env.APP_USER }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: APP_DIR,APP_USER
          script: |
            set -euo pipefail
            sudo tee /etc/systemd/system/flaskapp.service >/dev/null <<EOF
            [Unit]
            Description=Flask app (Gunicorn)
            After=network.target mysql.service

            [Service]
            User=${APP_USER}
            Group=www-data
            WorkingDirectory=${APP_DIR}/app
            EnvironmentFile=${APP_DIR}/.env
            ExecStart=${APP_DIR}/venv/bin/gunicorn --workers 3 --bind unix:${APP_DIR}/flaskapp.sock --access-logfile ${APP_DIR}/logs/access.log --error-logfile ${APP_DIR}/logs/error.log wsgi:app
            Restart=always

            [Install]
            WantedBy=multi-user.target
            EOF

            sudo tee /etc/nginx/sites-available/flaskapp >/dev/null <<EOF
            server {
                listen 80 default_server;
                server_name _;
                client_max_body_size 10M;
                location / {
                    include proxy_params;
                    proxy_pass http://unix:${APP_DIR}/flaskapp.sock;
                }
            }
            EOF
            sudo ln -sf /etc/nginx/sites-available/flaskapp /etc/nginx/sites-enabled/flaskapp
            sudo rm -f /etc/nginx/sites-enabled/default
            sudo usermod -aG "$APP_USER" www-data
            sudo nginx -t && sudo systemctl reload nginx
            sudo systemctl daemon-reload
            sudo systemctl enable flaskapp

            # Firewall
            sudo ufw allow OpenSSH
            sudo ufw allow 'Nginx Full'
            sudo ufw --force enable

      - name: Verificación
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            python3 --version
            mysql --version
            nginx -v
            systemctl is-active mysql nginx
